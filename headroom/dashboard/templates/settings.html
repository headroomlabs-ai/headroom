<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Headroom Settings</title>
    <script src="/dashboard/static/tailwind.min.js"></script>
    <script src="/dashboard/static/alpine.min.js" defer></script>
    <script>
        (function () {
            const saved = localStorage.getItem('headroom-theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            if (saved === 'light' || (!saved && !prefersDark)) {
                document.documentElement.classList.remove('dark');
            } else {
                document.documentElement.classList.add('dark');
            }
        })();
        tailwind.config = { darkMode: 'class', theme: { extend: { colors: { accent: '#22d3ee' } } } };
    </script>
    <style>
        :root { --bg: #f9fafb; --surface: #ffffff; --border: #e5e7eb; --muted: #6b7280; }
        .dark { --bg: #0b0f14; --surface: #111827; --border: #1f2937; --muted: #9ca3af; }
        body { background: var(--bg); }
        .card { background: var(--surface); border: 1px solid var(--border); }
        .field-help { color: var(--muted); }
        input, select { background: var(--surface); border: 1px solid var(--border); }
        input:disabled, select:disabled { opacity: .55; cursor: not-allowed; }
        [x-cloak] { display: none !important; }
        .nav-item { color: var(--muted); }
        .nav-item[aria-current="page"] { background: var(--surface); border: 1px solid var(--border); color: inherit; }
    </style>
</head>
<body class="text-gray-800 dark:text-gray-100 min-h-screen" x-data="settingsPage()" x-init="init()">
    <div class="max-w-6xl mx-auto px-4 py-8">
        <div class="flex items-center justify-between mb-6">
            <div>
                <h1 class="text-2xl font-semibold">Settings</h1>
                <p class="text-sm field-help">Grouped by feature. Most changes need a restart; Output Shaping applies live.</p>
            </div>
            <a href="/dashboard" class="text-sm text-accent hover:underline">&larr; Dashboard</a>
        </div>

        <div class="flex flex-col md:flex-row gap-6">
            <!-- Left sidebar: one entry per populated page -->
            <nav class="md:w-56 shrink-0" aria-label="Settings pages">
                <template x-if="loaded">
                    <ul class="flex md:flex-col gap-1 flex-wrap">
                        <template x-for="page in pages" :key="page">
                            <li>
                                <button type="button"
                                        @click="setPage(page)"
                                        :aria-current="activePage === page ? 'page' : null"
                                        class="nav-item w-full text-left px-3 py-2 rounded text-sm font-medium hover:text-accent"
                                        x-text="page"></button>
                            </li>
                        </template>
                    </ul>
                </template>
            </nav>

            <!-- Main pane: active page fields -->
            <main class="flex-1 min-w-0">
                <!-- Status / error surface -->
                <template x-if="loadError">
                    <div class="card rounded-lg p-4 mb-4 border-red-500/50">
                        <p class="text-red-500 text-sm" x-text="loadError"></p>
                    </div>
                </template>

                <!-- Apply / restart banner -->
                <template x-if="banner">
                    <div class="card rounded-lg p-4 mb-4 border-amber-500/50" x-cloak>
                        <p class="text-amber-500 text-sm font-medium" x-text="banner"></p>
                    </div>
                </template>

                <template x-if="loaded">
                    <form @submit.prevent>
                        <!-- Normal (basic) groups on the active page -->
                        <template x-for="group in groupsIn(activePage, 'basic')" :key="'b-' + group">
                            <div class="card rounded-lg p-5 mb-4">
                                <template x-if="groupsIn(activePage, 'basic').length > 1">
                                    <h2 class="text-sm font-semibold uppercase tracking-wide field-help mb-4" x-text="group"></h2>
                                </template>
                                <template x-for="field in fieldsInGroup(activePage, group, 'basic')" :key="field.key">
                                    <div class="mb-4 last:mb-0">
                                        <div>
                                            <label class="flex items-center justify-between gap-4">
                                                <span class="text-sm font-medium" x-text="field.label"></span>
                                                <template x-if="field.type === 'bool'">
                                                    <input type="checkbox" class="h-5 w-5 accent-cyan-400" :disabled="isLocked(field)" x-model="values[field.key]">
                                                </template>
                                                <template x-if="field.type === 'optional-bool'">
                                                    <select class="rounded px-2 py-1 text-sm w-56" :disabled="isLocked(field)" x-model="values[field.key]">
                                                        <option value="">Default (unset)</option>
                                                        <option value="true">Enabled</option>
                                                        <option value="false">Disabled</option>
                                                    </select>
                                                </template>
                                                <template x-if="field.type === 'enum'">
                                                    <select class="rounded px-2 py-1 text-sm w-56" :disabled="isLocked(field)" x-model="values[field.key]">
                                                        <template x-for="choice in field.choices" :key="choice">
                                                            <option :value="choice" x-text="choice"></option>
                                                        </template>
                                                    </select>
                                                </template>
                                                <template x-if="field.type === 'int' || field.type === 'float'">
                                                    <input type="number" class="rounded px-2 py-1 text-sm w-56" :step="field.type === 'float' ? 'any' : '1'" :min="field.minimum" :max="field.maximum" :disabled="isLocked(field)" x-model.number="values[field.key]">
                                                </template>
                                                <template x-if="field.type === 'str' || field.type === 'header-map'">
                                                    <input :type="field.secret ? 'password' : 'text'" class="rounded px-2 py-1 text-sm w-56" :disabled="isLocked(field)" x-model="values[field.key]" @input="delete clearedKeys[field.key]">
                                                </template>
                                            </label>
                                            <template x-if="field.secret && !isLocked(field)">
                                                <button type="button" @click="values[field.key] = ''; clearedKeys[field.key] = true" class="text-xs text-red-500/80 hover:underline mt-1">Clear stored value</button>
                                            </template>
                                            <p class="text-xs field-help mt-1" x-text="field.help"></p>
                                            <template x-if="field.manifest_managed && manifestManaged">
                                                <p class="text-xs text-amber-500/80 mt-1">Managed by the install manifest — change via <code>headroom install</code>.</p>
                                            </template>
                                            <template x-if="field.env_override && !(field.manifest_managed && manifestManaged)">
                                                <p class="text-xs text-amber-500/80 mt-1">Overridden by environment variable <code x-text="field.env"></code> -- edits here have no effect until it's unset.</p>
                                            </template>
                                            <template x-if="field.env_present && !field.env_override">
                                                <p class="text-xs field-help mt-1">Environment variable <code x-text="field.env"></code> is set — this panel takes precedence over it.</p>
                                            </template>
                                            <template x-if="fieldErrors[field.key]">
                                                <p class="text-xs text-red-500 mt-1" x-text="fieldErrors[field.key]"></p>
                                            </template>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </template>

                        <!-- Advanced (collapsible; collapsed by default, open on all-advanced pages) -->
                        <template x-if="hasAdvanced(activePage)">
                            <div class="card rounded-lg mb-4">
                                <button type="button" @click="toggleAdvanced(activePage)"
                                        :aria-expanded="isAdvancedOpen(activePage)"
                                        class="w-full flex items-center justify-between p-5 text-sm font-semibold uppercase tracking-wide field-help">
                                    <span>Advanced</span>
                                    <span x-text="isAdvancedOpen(activePage) ? '▾' : '▸'"></span>
                                </button>
                                <div x-show="isAdvancedOpen(activePage)" x-cloak class="px-5 pb-5">
                                    <template x-for="group in groupsIn(activePage, 'advanced')" :key="'a-' + group">
                                        <div class="mb-6 last:mb-0">
                                            <template x-if="groupsIn(activePage, 'advanced').length > 1">
                                                <h3 class="text-xs font-semibold uppercase tracking-wide field-help mb-3" x-text="group"></h3>
                                            </template>
                                            <template x-for="field in fieldsInGroup(activePage, group, 'advanced')" :key="field.key">
                                                <div class="mb-4 last:mb-0">
                                                    <label class="flex items-center justify-between gap-4">
                                                        <span class="text-sm font-medium" x-text="field.label"></span>
                                                        <template x-if="field.type === 'bool'">
                                                            <input type="checkbox" class="h-5 w-5 accent-cyan-400" :disabled="isLocked(field)" x-model="values[field.key]">
                                                        </template>
                                                        <template x-if="field.type === 'optional-bool'">
                                                            <select class="rounded px-2 py-1 text-sm w-56" :disabled="isLocked(field)" x-model="values[field.key]">
                                                                <option value="">Default (unset)</option>
                                                                <option value="true">Enabled</option>
                                                                <option value="false">Disabled</option>
                                                            </select>
                                                        </template>
                                                        <template x-if="field.type === 'enum'">
                                                            <select class="rounded px-2 py-1 text-sm w-56" :disabled="isLocked(field)" x-model="values[field.key]">
                                                                <template x-for="choice in field.choices" :key="choice">
                                                                    <option :value="choice" x-text="choice"></option>
                                                                </template>
                                                            </select>
                                                        </template>
                                                        <template x-if="field.type === 'int' || field.type === 'float'">
                                                            <input type="number" class="rounded px-2 py-1 text-sm w-56" :step="field.type === 'float' ? 'any' : '1'" :min="field.minimum" :max="field.maximum" :disabled="isLocked(field)" x-model.number="values[field.key]">
                                                        </template>
                                                        <template x-if="field.type === 'str' || field.type === 'header-map'">
                                                            <input :type="field.secret ? 'password' : 'text'" class="rounded px-2 py-1 text-sm w-56" :disabled="isLocked(field)" x-model="values[field.key]" @input="delete clearedKeys[field.key]">
                                                        </template>
                                                    </label>
                                                    <template x-if="field.secret && !isLocked(field)">
                                                        <button type="button" @click="values[field.key] = ''; clearedKeys[field.key] = true" class="text-xs text-red-500/80 hover:underline mt-1">Clear stored value</button>
                                                    </template>
                                                    <p class="text-xs field-help mt-1" x-text="field.help"></p>
                                                    <template x-if="field.manifest_managed && manifestManaged">
                                                        <p class="text-xs text-amber-500/80 mt-1">Managed by the install manifest — change via <code>headroom install</code>.</p>
                                                    </template>
                                                    <template x-if="field.env_override && !(field.manifest_managed && manifestManaged)">
                                                        <p class="text-xs text-amber-500/80 mt-1">Overridden by environment variable <code x-text="field.env"></code> -- edits here have no effect until it's unset.</p>
                                                    </template>
                                                    <template x-if="field.env_present && !field.env_override">
                                                        <p class="text-xs field-help mt-1">Environment variable <code x-text="field.env"></code> is set — this panel takes precedence over it.</p>
                                                    </template>
                                                    <template x-if="fieldErrors[field.key]">
                                                        <p class="text-xs text-red-500 mt-1" x-text="fieldErrors[field.key]"></p>
                                                    </template>
                                                </div>
                                            </template>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>

                        <div class="flex items-center gap-3 mt-6">
                            <button type="button" @click="save()" :disabled="busy"
                                    class="px-4 py-2 rounded bg-gray-700 hover:bg-gray-600 text-white text-sm disabled:opacity-50">
                                Save
                            </button>
                            <span class="text-sm field-help" x-text="status"></span>
                        </div>
                    </form>
                </template>
            </main>
        </div>
    </div>

    <script>
        function settingsPage() {
            return {
                loaded: false,
                loadError: '',
                fields: [],
                groups: [],
                pages: [],
                activePage: '',
                advancedOpen: {},  // per-page override of the Advanced collapse (else default rule)
                values: {},
                initialValues: {},
                storedValues: {},
                manifestManaged: false,  // true on supervised installs (locks manifest fields)
                fieldErrors: {},
                banner: '',
                status: '',
                busy: false,
                clearedKeys: {},  // secret fields explicitly cleared this session (send null on save)

                async init() {
                    try {
                        const res = await fetch('/settings/schema');
                        if (!res.ok) throw new Error('HTTP ' + res.status);
                        const schema = await res.json();
                        this.fields = schema.fields || [];
                        this.groups = schema.groups || [];
                        this.pages = schema.pages || [];
                        // Seed the editable model from the effective values. optional-bool
                        // is modelled as a tri-state string ('' | 'true' | 'false') so the
                        // "unset" state is distinct from an explicit off.
                        for (const f of this.fields) {
                            const v = schema.values ? schema.values[f.key] : f.value;
                            this.values[f.key] = f.type === 'optional-bool' ? this.triValue(v) : v;
                            this.initialValues[f.key] = this.values[f.key];
                            this.storedValues[f.key] = f.stored;
                        }
                        this.manifestManaged = !!schema.supervised;
                        // Deep-link: #page=<Name> selects a page on load; else the first.
                        const hash = decodeURIComponent((location.hash.match(/#page=(.+)/) || [])[1] || '');
                        this.activePage = this.pages.includes(hash) ? hash : (this.pages[0] || '');
                        this.loaded = true;
                    } catch (e) {
                        this.loadError = 'Failed to load settings: ' + e.message;
                    }
                },

                setPage(page) {
                    this.activePage = page;
                    try { history.replaceState(null, '', '#page=' + encodeURIComponent(page)); } catch (e) { /* ignore */ }
                },

                fieldsInGroup(page, group, tier) {
                    return this.fields.filter(f => f.page === page && f.group === group && f.tier === tier);
                },

                groupsIn(page, tier) {
                    // Distinct groups (registry order) for a page/tier — used as sub-headers.
                    const seen = [];
                    for (const f of this.fields) {
                        if (f.page === page && f.tier === tier && !seen.includes(f.group)) seen.push(f.group);
                    }
                    return seen;
                },

                hasAdvanced(page) { return this.fields.some(f => f.page === page && f.tier === 'advanced'); },

                isAdvancedOpen(page) {
                    // Collapsed by default, but a page with no Normal fields opens its
                    // Advanced section so it isn't blank until the user expands it.
                    if (page in this.advancedOpen) return this.advancedOpen[page];
                    return !this.fields.some(f => f.page === page && f.tier === 'basic');
                },

                toggleAdvanced(page) { this.advancedOpen[page] = !this.isAdvancedOpen(page); },

                triValue(v) {
                    if (v === true || v === 'true' || v === '1' || v === 'yes' || v === 'on') return 'true';
                    if (v === false || v === 'false' || v === '0' || v === 'no' || v === 'off') return 'false';
                    return '';
                },

                isLocked(field) { return (!!field.manifest_managed && this.manifestManaged) || !!field.env_override; },

                isEmptyValue(value) { return value === '' || value === null || value === undefined; },

                normalizedComparable(value) { return this.isEmptyValue(value) ? null : value; },

                editableValues() {
                    // Send only changed, non-locked values. The server merges partial
                    // updates; posting every effective default would freeze those
                    // defaults into settings.json and change future upgrade behavior.
                    // Explicit `null` clears a previously stored value.
                    const out = {};
                    for (const f of this.fields) {
                        if (this.isLocked(f)) continue;
                        if (this.clearedKeys[f.key]) { out[f.key] = null; continue; }
                        if (f.type === 'optional-bool') {
                            const cur = this.triValue(this.values[f.key]);
                            const base = this.triValue(this.initialValues[f.key]);
                            if (cur === base) continue;
                            out[f.key] = cur === '' ? null : (cur === 'true');
                            continue;
                        }
                        const v = this.values[f.key];
                        const baseline = this.initialValues[f.key];
                        if (this.isEmptyValue(v)) {
                            if (!this.isEmptyValue(baseline)) out[f.key] = null;
                            continue;
                        }
                        if (this.normalizedComparable(v) === this.normalizedComparable(baseline)) continue;
                        out[f.key] = v;
                    }
                    return out;
                },

                async save() {
                    this.busy = true; this.status = 'Saving…'; this.fieldErrors = {};
                    try {
                        const res = await fetch('/settings', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ values: this.editableValues() }),
                        });
                        const data = await res.json();
                        if (res.status === 200) {
                            this.status = 'Saved.';
                            const changed = data.changed_keys || [];
                            const live = data.live_keys || [];
                            const restart = changed.filter(k => !live.includes(k));
                            if (!changed.length) {
                                this.banner = 'Saved — no changes to apply.';
                            } else if (!restart.length) {
                                this.banner = 'Applied live — no restart needed.';
                            } else if (!live.length) {
                                this.banner = 'Restart required to apply: ' + restart.join(', ');
                            } else {
                                this.banner = 'Live changes applied; restart required for: ' + restart.join(', ');
                            }
                            this.clearedKeys = {};
                            for (const f of this.fields) {
                                this.initialValues[f.key] = this.values[f.key];
                            }
                        } else if (res.status === 422) {
                            this.fieldErrors = data.field_errors || {};
                            this.status = 'Fix the highlighted fields.';
                        } else {
                            this.status = data.error || ('Error ' + res.status);
                        }
                    } catch (e) {
                        this.status = 'Save failed: ' + e.message;
                    } finally {
                        this.busy = false;
                    }
                },

            };
        }
    </script>
</body>
</html>
