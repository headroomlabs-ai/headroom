name = "headroom-beacon"
main = "worker.js"
compatibility_date = "2025-01-01"

# PHASE 1 — deploy to <name>.<subdomain>.workers.dev with no DNS changes.
# Lets the whole path be tested against a real client before headroomlabs.ai
# nameservers move anywhere.
workers_dev = true

# PHASE 2 — the permanent address. Uncomment once headroomlabs.ai is on
# Cloudflare nameservers, then redeploy. This string is baked into every
# released client (DEFAULT_ENDPOINT in headroom/telemetry/session.py), so it can
# never change afterwards — everything behind it can.
#
# Deploying this while the zone is still on Namecheap fails: wrangler cannot
# find the zone. That is the intended guardrail, not a bug.
#
# [[routes]]
# pattern = "otlp.headroomlabs.ai/v1/logs"
# zone_name = "headroomlabs.ai"
# custom_domain = false

# The corpus. R2 rather than S3 specifically for zero egress: training jobs
# re-read the whole dataset, and on S3 that is a recurring bill for data we
# already own.
[[r2_buckets]]
binding = "CORPUS"
bucket_name = "headroom-telemetry"

# Optional metrics lane, added later without touching this file:
#   npx wrangler secret put METRICS_OTLP_URL
#   npx wrangler secret put METRICS_OTLP_AUTH
# Absent = R2 only, which is the right place to start.

# Hourly compaction of sessions/ into rollup/ — see scheduled() in worker.js.
# At :05 so the hour being rolled up is definitely closed. The cron only
# enqueues; the reading is done by the queue consumer below.
[triggers]
crons = ["5 * * * *"]

# One message is one slice (a sixteenth) of one hour. The queues must exist
# before the first deploy that names them:
#   npx wrangler queues create beacon-rollup
#   npx wrangler queues create beacon-rollup-dlq
# and, for `--env dev`, `npx wrangler queues create beacon-rollup-dev`.
[[queues.producers]]
binding = "ROLLUP_QUEUE"
queue = "beacon-rollup"

# max_batch_size = 1 so every slice is its own invocation: its own six
# connections and its own 15 minutes, which is the entire point of the queue.
# Concurrency is left to autoscale (up to 250), so a backlog drains in parallel.
# A slice that keeps failing lands in the dead-letter queue, where it can be
# inspected by hand until the queue's retention expires it — nothing reads or
# alerts on that queue. scheduled() enqueues the hour again after three hours
# either way, so the dead-letter queue is evidence, not the recovery path.
[[queues.consumers]]
queue = "beacon-rollup"
max_batch_size = 1
max_retries = 5
dead_letter_queue = "beacon-rollup-dlq"

# Every R2 binding call is a subrequest. A slice is ~1.5k reads today, under the
# paid default of 10k, but that default is one fleet doubling or two away. This
# only raises a ceiling.
#
# Workers Paid only — on the Free plan this key is rejected outright ("CPU
# limits are not supported for the Free plan"), and Queues are a paid feature
# as well.
[limits]
subrequests = 100000

[observability]
enabled = true

# Invocation logs record every request's headers and Cloudflare metadata,
# which includes the sender's IP address (cf-connecting-ip, x-real-ip) and
# their city, postal code and coordinates. worker.js never reads these, but
# with invocation logs on, Cloudflare writes them to Workers Logs for every
# beacon POST anyway. Keep them off; errors and console.log still appear.
[observability.logs]
invocation_logs = false

# Abuse bound for this unauthenticated endpoint, enforced in fetch(). One
# shared key, not per-IP: the Worker never reads the sender's address, and a
# per-IP key would mean reading it. Counters are per Cloudflare location, so
# this caps each location, not the planet. Normal load is ~300 req/min in
# total (~2 req/hour per client), so 3000/min per location is ~10x headroom
# while still bounding what a flood can cost in Worker time and R2 writes.
# Only 10 or 60 is accepted for `period`.
[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"
  [ratelimits.simple]
  limit = 3000
  period = 60

# Dev/test deployment: `npx wrangler deploy --env dev`. Its own Worker
# (headroom-beacon-dev) and its own bucket, so test traffic can never land in
# the production corpus. Bindings are not inherited by environments, so each
# one is restated here.
[env.dev]
name = "headroom-beacon-dev"
workers_dev = true

[[env.dev.r2_buckets]]
binding = "CORPUS"
bucket_name = "headroom-telemetry-dev"

[[env.dev.ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1002"
  [env.dev.ratelimits.simple]
  limit = 600
  period = 60

[[env.dev.queues.producers]]
binding = "ROLLUP_QUEUE"
queue = "beacon-rollup-dev"

[[env.dev.queues.consumers]]
queue = "beacon-rollup-dev"
max_batch_size = 1
max_retries = 5
