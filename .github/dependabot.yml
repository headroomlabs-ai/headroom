version: 2
updates:
  # Docker base image digest updates
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "docker"
    groups:
      docker-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions version updates
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    groups:
      actions-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Python dependency updates (pip)
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    # Limit simultaneous version-update PRs; security updates have a separate limit.
    open-pull-requests-limit: 5
    # MCP SDK 2.x removes the low-level Server API used by the shipping
    # proxy and mcp extras. Keep 1.x until the port tracked in GH #2658 lands.
    ignore:
      - dependency-name: "mcp"
        versions: [">=2.0.0"]
      # These releases do not fix the optional-extra advisories documented in
      # SECURITY.md. Keep future versions eligible for review; do not suppress
      # alerts or ignore these packages indefinitely.
      - dependency-name: "chromadb"
        versions: ["<=1.5.9"]
      - dependency-name: "accelerate"
        versions: ["<=1.15.0"]
    groups:
      pip-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # Rust dependency updates (cargo workspace: crates/*)
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # npm dependency updates (TS SDK, plugins, docs site)
  - package-ecosystem: npm
    directories:
      - "/sdk/typescript"
      - "/plugins/openclaw"
      - "/plugins/opencode"
      - "/e2e/wrap/tools"
      - "/docs"
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
