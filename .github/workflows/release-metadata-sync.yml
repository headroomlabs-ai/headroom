name: Release Metadata Sync

# Keep generated version-carrying files in sync on release-please's branch.
#
# Why this exists
# ---------------
# release-please only rewrites `pyproject.toml` plus the `extra-files` listed in
# `.release-please-config.json` (currently the TypeScript SDK and OpenClaw
# package.json). Several other tracked files also carry the version, and
# `server.json` is asserted byte-for-byte against `render_server_json()` — which
# derives its version from `pyproject.toml`. So the moment release-please bumps
# the version, `tests/test_mcp_registry/test_server_json.py::
# test_root_server_json_matches_builder` fails on the release PR, and the release
# cannot be merged. That is what blocked v0.33.0 (PR #2339).
#
# `release.yml` already runs `scripts/version-sync.py` before its own
# `verify-versions.py` gate, so the release *build* self-heals in the workspace.
# The regular CI test job does not, so the fix has to be committed.
#
# Why a workflow rather than more `extra-files` entries
# ----------------------------------------------------
# `scripts/version-sync.py` is the single place that knows every version-carrying
# file. Restating that list as per-file jsonpaths would duplicate it, and a
# jsonpath that silently fails to match produces exactly the failure we are trying
# to remove. Running the script instead means files added to it in future are
# covered with no change here.
#
# Why the push trigger
# --------------------
# release-please regenerates (force-pushes) its branch on every merge to main.
# That is what repeatedly wiped the hand-pushed metadata fixes on #2339. Keying
# off a push to the branch means the sync re-applies after every regeneration
# instead of being lost.
#
# Why two jobs
# ------------
# This runs on a push to the unprotected glob release-please--branches--**, and it
# executes scripts/*.py *from the pushed branch*. Anything that code does to the
# runner (a .git/hooks/pre-commit, `git config` entries, GITHUB_ENV / GITHUB_PATH
# lines) would carry into every later step of the same job. So the branch's code
# runs in the `sync` job, which holds no release credential and only produces a
# patch. The `push` job, which holds the credential, never runs branch code: it
# checks the branch out fresh, applies the patch, and pushes.

on:
  push:
    branches:
      - "release-please--branches--**"

permissions:
  contents: read

concurrency:
  # Never cancel: a half-applied sync would leave the release PR inconsistent.
  group: release-metadata-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.patch.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The exact pushed commit, not the branch tip: if the branch moves
          # meanwhile, the push below fails as non-fast-forward instead of
          # landing a patch made for an older tree.
          ref: ${{ github.sha }}
          # No credential is ever written to this job's .git/config. The job runs
          # branch-supplied scripts.
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # version-sync.py is stdlib-only (json/re/tomllib), so no install step.
      - name: Sync version-carrying files release-please does not bump
        run: python scripts/version-sync.py

      - name: Verify all versions agree
        run: python scripts/verify-versions.py

      - name: Capture the change as a patch
        id: patch
        run: |
          if git diff --quiet; then
            echo "Already in sync — nothing to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git add -A
          git diff --cached --binary > "${RUNNER_TEMP}/sync.patch"
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ steps.patch.outputs.changed == 'true' }}
        with:
          name: version-sync-patch
          path: ${{ runner.temp }}/sync.patch
          retention-days: 1
          if-no-files-found: error

  push:
    needs: sync
    if: ${{ needs.sync.outputs.changed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Prefer a short-lived, repo-scoped GitHub App installation token over a
      # personal PAT. Gated on the repo variable so an unconfigured app simply
      # falls through to the existing chain instead of breaking the release.
      - name: Mint installation token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        continue-on-error: true
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # A fresh checkout: nothing from the `sync` job's runner state is carried here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: version-sync-patch
          path: ${{ runner.temp }}

      # No token in this step. The patch was produced by branch code, so it is
      # untrusted input: it may change only the files scripts/version-sync.py
      # writes. Keep this list in step with that script.
      - name: Apply the patch to the files version-sync writes
        run: |
          git apply --index --binary "${RUNNER_TEMP}/sync.patch"
          allowed=(
            .claude-plugin/marketplace.json
            .github/plugin/marketplace.json
            .releasemetadata
            plugins/headroom-agent-hooks/.claude-plugin/plugin.json
            plugins/headroom-agent-hooks/.github/plugin/plugin.json
            plugins/headroom-skill/.claude-plugin/plugin.json
            plugins/headroom-skill/.github/plugin/plugin.json
            plugins/headroom-snip/.claude-plugin/plugin.json
            plugins/openclaw/package.json
            plugins/opencode/package.json
            pyproject.toml
            sdk/typescript/package.json
            server.json
            uv.lock
          )
          # NUL-separated and with renames split into delete + add, so every
          # path the patch touches is listed verbatim (no quoting, no rename
          # hiding its source).
          while IFS= read -r -d '' path; do
            ok=0
            for name in "${allowed[@]}"; do
              if [ "$path" = "$name" ]; then ok=1; fi
            done
            if [ "$ok" -ne 1 ]; then
              printf '::error::version-sync patch changes %q, which it does not own; refusing to push it\n' "$path"
              exit 1
            fi
          done < <(git diff --cached --no-renames --name-only -z)

      - name: Commit and push the synced metadata
        env:
          # An app installation token if one was minted, else the existing
          # chain. A PAT (not GITHUB_TOKEN) is still preferred here for the same
          # reason release-please.yml wants one: a push made with GITHUB_TOKEN
          # does not trigger workflows, so the release PR's checks would never
          # re-run against the synced commit and would stay red. Supplied only
          # to this step, in a job that never runs branch code.
          SYNC_TOKEN: ${{ steps.app-token.outputs.token || secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Hooks off: nothing in this clone may run code while the token is set.
          git -c core.hooksPath=/dev/null commit --no-verify \
            -m "chore: sync generated version metadata"
          # The credential travels as an http.extraheader supplied through the
          # environment (GIT_CONFIG_*), so it is never on a command line or in
          # .git/config. The expansion below is a shell variable, not a workflow
          # expression, and the `printf | base64` pipe carries it on stdin.
          auth="$(printf 'x-access-token:%s' "${SYNC_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          # This push re-triggers this workflow. version-sync.py is idempotent, so
          # the next run finds no diff and exits in `sync` without pushing — the
          # loop terminates after one no-op run. HEAD is the pushed commit plus
          # the sync commit, so a branch that moved since fails non-fast-forward.
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic ${auth}" \
            git -c core.hooksPath=/dev/null push --no-verify origin HEAD:"${GITHUB_REF_NAME}"
