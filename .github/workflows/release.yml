name: Release

# ─── Package Registry Configuration ────────────────────────────────────────────
# Edit these constants to change package names, environments, and registries.
# All values are referenced via ${{ env.VAR }} throughout the workflow.
env:
  # PyPI
  PYPI_PACKAGE: headroom-ai
  PYPI_ENVIRONMENT: pypi

  # npm (npmjs.org)
  NPM_REGISTRY_URL: https://registry.npmjs.org
  NPM_SDK_PACKAGE: headroom-ai
  NPM_OPENCLAW_PACKAGE: headroom-openclaw
  NPM_OPENCODE_PACKAGE: headroom-opencode

  # GitHub Package Registry
  GITHUB_PACKAGES_REGISTRY_URL: https://npm.pkg.github.com

  # ─── Safety Gates ──────────────────────────────────────────────────────────────
  # Set to 'true' to skip a publish target (e.g., when tokens are not configured).
  # In GitHub: repo Settings → Variables → Actions Variables → New repository variable.
  # Locally via act: pass -e event.yml or set in .actrc.local (see .actrc.example).
  PYPI_SKIP: "false"
  NPM_SKIP: "false"
  GH_PACKAGES_SKIP: "false"

on:
  # Retain the reusable release interface for existing callers. Immutable
  # candidates call release-build.yml directly so no write-permission job
  # is present in their call tree. candidate_mode also blocks publication here.
  workflow_call:
    inputs:
      source_sha:
        description: "Exact full source SHA to build"
        required: true
        type: string
      candidate_mode:
        description: "Build and smoke exact bytes without publishing"
        required: true
        type: boolean
    outputs:
      version:
        description: "Resolved Python package version"
        value: ${{ jobs.build-and-smoke.outputs.version }}
  # Triggered when release-please's release PR is merged: the bot
  # tags the merge commit `vX.Y.Z` and creates a GitHub Release on
  # that tag, which fires the `release: published` event. Ordinary
  # pushes to main no longer trigger publishes — that was the old
  # behavior that burned PyPI's per-project storage quota by
  # uploading a fresh wheel matrix (~200 MB) per merged fix/feat PR.
  # See .github/workflows/release-please.yml for the PR-aggregator.
  release:
    types: [published]
  # X2: PR-time release dry-run. Trigger on PRs that touch release-
  # critical paths so the wheel matrix + smoke-import gate run BEFORE
  # merge — not after the tag is pushed and main is broken. Path
  # filter is deliberately narrow: source-only PRs to headroom-core
  # / headroom-proxy don't change wheel layout, so they don't need
  # the dry-run. Issues this would have caught: #379 (docker bake
  # name=), #382 (sdist os-mismatch), #384/#385/#386 (glibc shim
  # iterations), #387's own shellcheck regression.
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - ".github/workflows/release-build.yml"
      - ".github/workflows/docker.yml"
      - "crates/headroom-py/**"
      - "pyproject.toml"
      - "scripts/verify-versions.py"
      - "scripts/version-sync.py"
      - "scripts/build_npm_release_assets.mjs"
      - "scripts/verify_npm_release_assets.mjs"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:
    inputs:
      version:
        description: "Manual version override"
        required: false
      dry_run:
        description: "Skip publish"
        type: boolean
        default: false

concurrency:
  # Main release runs are namespaced by ref_name and never cancel
  # (cancel-in-progress: false) — losing a tag-push release mid-flight
  # would mean PyPI/Docker get partial state. PR dry-runs are
  # namespaced by PR number and DO cancel: rapid PR pushes shouldn't
  # spawn N parallel wheel builds, only the latest matters.
  group: release-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-smoke:
    permissions:
      contents: read
    uses: ./.github/workflows/release-build.yml
    with:
      source_sha: ${{ inputs.source_sha || github.sha }}

  publish-pypi:
    needs: [build-and-smoke]
    # X2: skip on pull_request — dry-run only verifies build+smoke,
    # never publishes. The other two predicates remain (workflow_dispatch
    # dry_run, vars-level skip).
    if: inputs.candidate_mode != true && github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true' && vars.PYPI_SKIP != 'true'
    environment: pypi  # NOTE: environment name must be a literal; update here if the GitHub environment name changes
    runs-on: ubuntu-latest
    permissions:
      id-token: write  # Required for OIDC trusted publishing
    steps:
      - name: Download merged dist artifact (sdist + cross-platform wheels)
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish ${{ env.PYPI_PACKAGE }} to PyPI
        id: pypi-publish
        uses: pypa/gh-action-pypi-publish@v1.14.2
        with:
          # Idempotent re-runs: when a wheel filename for the computed
          # version is already on PyPI (e.g. a previous push to main
          # already published this version, or this run's computed
          # semver hasn't bumped past the last release), treat the
          # existing file as a no-op instead of a hard failure. PyPA's
          # recommended pattern for release workflows that may run
          # multiple times against the same version.
          skip-existing: true
          attestations: false

  publish-npm:
    needs: [build-and-smoke]
    if: inputs.candidate_mode != true && github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true' && vars.NPM_SKIP != 'true'
    runs-on: ubuntu-latest
    # Publishes to npmjs.org via NPM_TOKEN secret; no GITHUB_TOKEN
    # write permissions needed.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ">=24.16.0 <25"
          registry-url: ${{ env.NPM_REGISTRY_URL }}

      # No artifact download required: the publish steps below pack and
      # publish directly from the checked-out source tree (sdk/typescript
      # and plugins/openclaw) via `npm pack` + `npm publish`. The
      # `dist` artifact is a Python-distribution aggregate produced by
      # `collect-dist`; it has no npm content. Earlier versions of
      # this workflow downloaded it speculatively, which now fails as
      # "Artifact not found" because publish-npm is not gated on
      # collect-dist. Removing the dead step is the right fix.

      - name: Publish ${{ env.NPM_SDK_PACKAGE }} (TypeScript SDK) to npmjs.org
        id: npm-sdk-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.build-and-smoke.outputs.npm_version }}"
          cd sdk/typescript
          npm ci
          npm run build
          npm version "$version" --no-git-tag-version --allow-same-version
          npm publish --access public
        continue-on-error: true

      - name: Publish ${{ env.NPM_OPENCLAW_PACKAGE }} to npmjs.org
        id: npm-openclaw-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.build-and-smoke.outputs.npm_version }}"
          cd plugins/openclaw
          npm ci
          npm run build
          npm version "$version" --no-git-tag-version --allow-same-version
          HEADROOM_NPM_VERSION="$version" node <<'EOF'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.dependencies = pkg.dependencies || {};
          pkg.dependencies["headroom-ai"] = `^${process.env.HEADROOM_NPM_VERSION}`;
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          EOF
          node prepare-dist.mjs
          npm publish --access public
        continue-on-error: true

      - name: Publish ${{ env.NPM_OPENCODE_PACKAGE }} to npmjs.org
        id: npm-opencode-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${{ needs.build-and-smoke.outputs.npm_version }}"
          cd plugins/opencode
          npm ci
          npm run build
          npm version "$version" --no-git-tag-version --allow-same-version
          HEADROOM_NPM_VERSION="$version" node <<'EOF'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.dependencies = pkg.dependencies || {};
          pkg.dependencies["headroom-ai"] = `^${process.env.HEADROOM_NPM_VERSION}`;
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          EOF
          npm publish --access public
        continue-on-error: true

      - name: npm publish notice
        if: steps.npm-sdk-publish.outcome == 'failure' || steps.npm-openclaw-publish.outcome == 'failure' || steps.npm-opencode-publish.outcome == 'failure'
        run: |
          echo "::notice::One or more npm publishes failed. Set NPM_SKIP=true in repo Variables to skip npm publishes if tokens are not configured."

  publish-github-packages:
    needs: [build-and-smoke]
    if: inputs.candidate_mode != true && github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true' && vars.GH_PACKAGES_SKIP != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Compute GitHub Packages scope
        id: gh-scope
        run: |
          scope="$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js for GitHub Package Registry
        uses: actions/setup-node@v7
        with:
          node-version: ">=24.16.0 <25"
          registry-url: ${{ env.GITHUB_PACKAGES_REGISTRY_URL }}

      # No artifact download required: the publish-github-packages flow
      # below `npm pack`s its own scoped tarball into a workdir and
      # publishes that. Same reasoning as publish-npm — the speculative
      # `dist` download was failing "Artifact not found" because this
      # job is not gated on `collect-dist`.

      - name: Publish ${{ env.NPM_SDK_PACKAGE }} to GitHub Package Registry
        id: gpr-sdk-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PACKAGES_SCOPE: ${{ steps.gh-scope.outputs.scope }}
        run: |
          workdir="$(mktemp -d)"
          assets_dir="$workdir/release-assets"
          mkdir -p "$assets_dir"

          cp -R sdk/typescript "$workdir/sdk"
          cd "$workdir/sdk"
          npm install
          npm run build
          npm version ${{ needs.build-and-smoke.outputs.npm_version }} --no-git-tag-version --allow-same-version
          unscoped_sdk_tarball="$(npm pack --pack-destination "$assets_dir" | tail -n 1)"
          node <<'EOF'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.name = `@${process.env.GITHUB_PACKAGES_SCOPE}/${pkg.name}`;
          pkg.publishConfig = {
            ...(pkg.publishConfig || {}),
            registry: process.env.GITHUB_PACKAGES_REGISTRY_URL,
          };
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          EOF
          sdk_tarball="$(npm pack --pack-destination "$assets_dir" | tail -n 1)"
          printf 'unscoped_sdk_tarball=%s\n' "$assets_dir/$unscoped_sdk_tarball" >> "$GITHUB_OUTPUT"
          printf 'sdk_tarball=%s\n' "$assets_dir/$sdk_tarball" >> "$GITHUB_OUTPUT"
          npm publish --access public --registry ${{ env.GITHUB_PACKAGES_REGISTRY_URL }}
        continue-on-error: true

      - name: Publish ${{ env.NPM_OPENCLAW_PACKAGE }} to GitHub Package Registry
        id: gpr-openclaw-publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_PACKAGES_SCOPE: ${{ steps.gh-scope.outputs.scope }}
          SDK_TARBALL: ${{ steps.gpr-sdk-publish.outputs.unscoped_sdk_tarball }}
        run: |
          workdir="$(mktemp -d)"
          cp -R plugins/openclaw "$workdir/openclaw"
          cd "$workdir/openclaw"
          node <<'EOF'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.dependencies = pkg.dependencies || {};
          delete pkg.dependencies["headroom-ai"];
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          EOF
          npm install
          npm install --no-save "$SDK_TARBALL"
          npm run build
          npm version ${{ needs.build-and-smoke.outputs.npm_version }} --no-git-tag-version --allow-same-version
          node <<'EOF'
          const fs = require("fs");
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const scopedSdk = `@${process.env.GITHUB_PACKAGES_SCOPE}/headroom-ai`;
          pkg.name = `@${process.env.GITHUB_PACKAGES_SCOPE}/${pkg.name}`;
          pkg.dependencies = pkg.dependencies || {};
          delete pkg.dependencies["headroom-ai"];
          pkg.dependencies[scopedSdk] = `^${pkg.version}`;
          pkg.publishConfig = {
            ...(pkg.publishConfig || {}),
            registry: process.env.GITHUB_PACKAGES_REGISTRY_URL,
          };
          fs.writeFileSync("package.json", `${JSON.stringify(pkg, null, 2)}\n`);
          EOF
          npm publish --access public --registry ${{ env.GITHUB_PACKAGES_REGISTRY_URL }}
        continue-on-error: true

      - name: GPR publish notice
        if: steps.gpr-sdk-publish.outcome == 'failure' || steps.gpr-openclaw-publish.outcome == 'failure'
        run: |
          echo "::notice::One or more GitHub Package Registry publishes failed. Check GITHUB_TOKEN permissions and package scope/repository settings. Set GH_PACKAGES_SKIP=true to skip."

  publish-docker:
    # Wait for the smoke-import gate. The docker images bundle the
    # same wheels we publish to PyPI; a wheel that can't import
    # cleanly on the manylinux floor will also fail the docker
    # image's `pip install` step. Failing here ~3 minutes earlier
    # than docker-build saves the matrix's wall-clock budget.
    needs: [build-and-smoke]
    if: inputs.candidate_mode != true && github.event_name != 'pull_request' && github.event.inputs.dry_run != 'true'
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/docker.yml
    with:
      version: ${{ needs.build-and-smoke.outputs.version }}
      enable_ref_tags: false

  create-release:
    needs: [build-and-smoke, publish-pypi, publish-npm, publish-github-packages, publish-docker]
    if: >-
      ${{
        always() &&
        inputs.candidate_mode != true &&
        github.event_name != 'pull_request' &&
        github.event.inputs.dry_run != 'true' &&
        needs.build-and-smoke.result == 'success' &&
        (vars.PYPI_SKIP == 'true' || needs.publish-pypi.result == 'success')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Download changelog artifact
        uses: actions/download-artifact@v8
        with:
          name: changelog
          path: /tmp

      - name: Download merged release assets (npm tarballs + wheels + sdist)
        uses: actions/download-artifact@v8
        with:
          name: release-assets-merged
          path: release-assets

      - name: Show changelog
        run: |
          ls -la /tmp/changelog-backup.md
          cp /tmp/changelog-backup.md .changelog.md
          cat .changelog.md

      - name: Show release assets
        run: |
          ls -la release-assets

      - name: Create or update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.build-and-smoke.outputs.version }}"
          TITLE="Release v${{ needs.build-and-smoke.outputs.version }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            # Release already exists — typically created by
            # release-please on release-PR merge with an auto-
            # generated changelog body. Don't overwrite its notes
            # (--notes-file would clobber them); only sync the
            # title in case detect-version's canonical form differs
            # from what the bot set.
            gh release edit "$TAG" --title "$TITLE"
          else
            gh release create "$TAG" --title "$TITLE" --notes-file .changelog.md
          fi

      - name: Publish ${{ env.PYPI_PACKAGE }} Python distributions to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.build-and-smoke.outputs.version }}"
          gh release upload "$TAG" release-assets/*.whl release-assets/*.tar.gz --clobber

      - name: Publish Node package tarballs to GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.build-and-smoke.outputs.version }}"
          gh release upload "$TAG" release-assets/*.tgz --clobber
