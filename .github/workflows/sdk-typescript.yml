name: SDK (TypeScript)

# The TypeScript SDK (sdk/typescript, published to npm as `headroom-ai`) has a
# vitest suite, a typecheck and a build, yet nothing in CI ever ran them. Two
# individually green PRs could leave `npm test` red on main (#3424 + #3370,
# repaired in #3796), and a dependabot bump of `ai` could break three adapter
# tests without anyone noticing (#3910). This gate runs the SDK's own
# test + typecheck + build whenever it (or this workflow) changes, mirroring
# the OpenCode plugin gate in opencode-plugin.yml.
on:
  pull_request:
    branches: [main]
    paths:
      - "sdk/typescript/**"
      - ".github/workflows/sdk-typescript.yml"
  push:
    branches: [main]
    paths:
      - "sdk/typescript/**"
      - ".github/workflows/sdk-typescript.yml"

permissions:
  contents: read

jobs:
  test:
    name: test + typecheck + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: sdk/typescript
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ">=24.16.0 <25"
          cache: npm
          cache-dependency-path: sdk/typescript/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
